<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #EDE7D8; }
      .grid { stroke: #C7BC9F; stroke-width: 0.8; stroke-dasharray: 4 4; }
      .line { stroke: #201D17; stroke-width: 2; fill: none; }
      .red { fill: #A32F1F; stroke: #A32F1F; }
      .red-stroke { stroke: #A32F1F; stroke-width: 2; fill: none; }
      .olive-stroke { stroke: #5C6B3F; stroke-width: 2; fill: none; }
      .text-main { font-family: 'Oswald', sans-serif; font-weight: 700; fill: #201D17; text-transform: uppercase; }
      .text-sub { font-family: 'IBM Plex Mono', monospace; font-size: 11px; fill: #4A453A; letter-spacing: 0.1em; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="400"/>

  <!-- Grid lines -->
  <line class="grid" x1="50" y1="50" x2="750" y2="50"/>
  <line class="grid" x1="50" y1="200" x2="750" y2="200"/>
  <line class="grid" x1="50" y1="350" x2="750" y2="350"/>
  <line class="grid" x1="200" y1="50" x2="200" y2="350"/>
  <line class="grid" x1="400" y1="50" x2="400" y2="350"/>
  <line class="grid" x1="600" y1="50" x2="600" y2="350"/>

  <!-- Tactical Target Figure Silhouette (Anatomical Schematic) -->
  <g transform="translate(400, 200)">
    <!-- Head -->
    <circle cx="0" cy="-110" r="22" class="line"/>
    <circle cx="0" cy="-110" r="14" class="red-stroke" stroke-dasharray="2 3"/>

    <!-- Neck & Traps -->
    <path d="M-10,-88 L-25,-75 M10,-88 L25,-75" class="line"/>

    <!-- Shoulders & Chest -->
    <path d="M-55,-70 L55,-70 L40,-15 L-40,-15 Z" class="line"/>
    <path d="M-38,-60 Q0,-40 38,-60" class="red-stroke"/>
    <path d="M0,-65 L0,-15" class="red-stroke"/>

    <!-- Core / Abdominals -->
    <path d="M-35,-15 L35,-15 L25,40 L-25,40 Z" class="line"/>
    <!-- 6-pack grid -->
    <line x1="-20" y1="0" x2="20" y2="0" class="red-stroke"/>
    <line x1="-18" y1="18" x2="18" y2="18" class="red-stroke"/>
    <line x1="0" y1="-15" x2="0" y2="40" class="red-stroke"/>

    <!-- Arms -->
    <path d="M-55,-70 L-75,-15 L-65,45" class="line"/>
    <path d="M55,-70 L75,-15 L65,45" class="line"/>
    <circle cx="-75" cy="-15" r="8" class="olive-stroke"/>
    <circle cx="75" cy="-15" r="8" class="olive-stroke"/>

    <!-- Legs & Glutes -->
    <path d="M-25,40 L-35,110 L-25,160" class="line"/>
    <path d="M25,40 L35,110 L25,160" class="line"/>
    <path d="M-5,40 L-10,110 L-15,160" class="line"/>
    <path d="M5,40 L10,110 L15,160" class="line"/>

    <!-- Target Reticle Overlay -->
    <circle cx="0" cy="-40" r="65" class="red-stroke" stroke-width="1.5"/>
    <line x1="-80" y1="-40" x2="-50" y2="-40" class="red-stroke"/>
    <line x1="50" y1="-40" x2="80" y2="-40" class="red-stroke"/>
    <line x1="0" y1="-120" x2="0" y2="-90" class="red-stroke"/>
    <line x1="0" y1="10" x2="0" y2="40" class="red-stroke"/>
  </g>

  <!-- Labels & Callouts -->
  <g class="text-sub">
    <!-- Chest / Pectorals callout -->
    <line x1="440" y1="150" x2="560" y2="110" class="red-stroke"/>
    <circle cx="560" cy="110" r="3" class="red"/>
    <text x="570" y="114" class="text-main" font-size="14" fill="#A32F1F">CHEST / PECS</text>
    <text x="570" y="130">Pushes · Dips · Explosive</text>

    <!-- Core callout -->
    <line x1="420" y1="200" x2="560" y2="200" class="red-stroke"/>
    <circle cx="560" cy="200" r="3" class="red"/>
    <text x="570" y="204" class="text-main" font-size="14" fill="#A32F1F">CORE / ABS</text>
    <text x="570" y="220">Planks · Bicycles · Bracing</text>

    <!-- Quads callout -->
    <line x1="430" y1="280" x2="560" y2="300" class="red-stroke"/>
    <circle cx="560" cy="300" r="3" class="red"/>
    <text x="570" y="304" class="text-main" font-size="14" fill="#A32F1F">QUADS / LEGS</text>
    <text x="570" y="320">Squats · Lunges · Wall Sit</text>

    <!-- Shoulders callout -->
    <line x1="340" y1="130" x2="220" y2="110" class="red-stroke"/>
    <circle cx="220" cy="110" r="3" class="red"/>
    <text x="120" y="114" class="text-main" font-size="14" fill="#A32F1F">DELTOIDS</text>
    <text x="120" y="130">Pike Push-ups · Holds</text>

    <!-- Back callout -->
    <line x1="335" y1="230" x2="220" y2="250" class="red-stroke"/>
    <circle cx="220" cy="250" r="3" class="red"/>
    <text x="110" y="254" class="text-main" font-size="14" fill="#A32F1F">POSTERIOR CHAIN</text>
    <text x="110" y="270">Superman · Glute Bridges</text>
  </g>

  <!-- Header Text -->
  <text x="60" y="80" class="text-main" font-size="22" letter-spacing="2">FIELD MANUAL DIAGRAM #01</text>
  <text x="60" y="100" class="text-sub">FULL BODY TARGETING SCHEMATIC — NO EQUIPMENT</text>

  <!-- Footer Seal Stamp -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="130" height="36" fill="none" stroke="#A32F1F" stroke-width="2"/>
    <text x="65" y="23" text-anchor="middle" class="text-main" font-size="12" fill="#A32F1F">APPROVED SYSTEM</text>
  </g>
</svg>
