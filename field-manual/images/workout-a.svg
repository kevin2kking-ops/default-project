<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <rect width="800" height="320" fill="#EDE7D8"/>
  <rect x="15" y="15" width="770" height="290" fill="none" stroke="#201D17" stroke-width="2"/>
  <text x="35" y="45" font-family="'Oswald', sans-serif" font-weight="700" font-size="20" fill="#201D17">WORKOUT A — UPPER BODY &amp; CORE VISUAL SYSTEM</text>
  <text x="35" y="65" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4A453A">Target: Chest, Deltoids, Triceps, Abs, Obliques</text>
  
  <!-- Grid of 10 Exercise Diagrams -->
  <!-- 1. Standard Pushup -->
  <g transform="translate(35, 85)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="45" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="45" x2="90" y2="55" stroke="#201D17" stroke-width="3"/>
    <line x1="50" y1="47" x2="45" y2="70" stroke="#201D17" stroke-width="2"/>
    <line x1="80" y1="53" x2="85" y2="70" stroke="#201D17" stroke-width="2"/>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">1. PUSH-UP</text>
  </g>

  <!-- 2. Diamond Pushup -->
  <g transform="translate(185, 85)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="45" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="45" x2="90" y2="55" stroke="#201D17" stroke-width="3"/>
    <polygon points="55,62 60,67 55,70 50,67" fill="none" stroke="#A32F1F" stroke-width="2"/>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">2. DIAMOND</text>
  </g>

  <!-- 3. Wide Pushup -->
  <g transform="translate(335, 85)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="42" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="45" x2="90" y2="53" stroke="#201D17" stroke-width="3"/>
    <line x1="45" y1="47" x2="30" y2="70" stroke="#201D17" stroke-width="2"/>
    <line x1="60" y1="50" x2="75" y2="70" stroke="#201D17" stroke-width="2"/>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">3. WIDE PUSH-UP</text>
  </g>

  <!-- 4. Chair Dips -->
  <g transform="translate(485, 85)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <rect x="75" y="40" width="30" height="8" stroke="#201D17" fill="none" stroke-width="2"/>
    <circle cx="50" cy="30" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <path d="M50,36 L55,55 L45,70" fill="none" stroke="#201D17" stroke-width="2"/>
    <path d="M55,55 L75,55" fill="none" stroke="#A32F1F" stroke-width="2"/>
    <line x1="15" y1="70" x2="120" y2="70" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">4. CHAIR DIP</text>
  </g>

  <!-- 5. Pike Pushup -->
  <g transform="translate(635, 85)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="67" cy="50" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <path d="M67,55 L55,25 L85,65" fill="none" stroke="#201D17" stroke-width="3"/>
    <path d="M55,25 L35,65" fill="none" stroke="#201D17" stroke-width="2.5"/>
    <line x1="15" y1="65" x2="120" y2="65" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">5. PIKE PUSH-UP</text>
  </g>

  <!-- Row 2 -->
  <!-- 6. Incline Pushup -->
  <g transform="translate(35, 195)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <rect x="75" y="40" width="30" height="25" stroke="#C7BC9F" fill="none" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="33" x2="75" y2="43" stroke="#201D17" stroke-width="3"/>
    <line x1="36" y1="33" x2="25" y2="65" stroke="#201D17" stroke-width="2"/>
    <line x1="15" y1="65" x2="120" y2="65" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">6. INCLINE PUSH-UP</text>
  </g>

  <!-- 7. Plank Hold -->
  <g transform="translate(185, 195)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="45" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="48" x2="95" y2="55" stroke="#201D17" stroke-width="3.5"/>
    <line x1="45" y1="50" x2="43" y2="65" stroke="#201D17" stroke-width="2"/>
    <line x1="95" y1="55" x2="100" y2="65" stroke="#201D17" stroke-width="2"/>
    <line x1="15" y1="65" x2="120" y2="65" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">7. PLANK HOLD</text>
  </g>

  <!-- 8. Side Plank -->
  <g transform="translate(335, 195)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="40" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <line x1="36" y1="43" x2="85" y2="55" stroke="#201D17" stroke-width="3.5"/>
    <line x1="45" y1="45" x2="42" y2="65" stroke="#201D17" stroke-width="2"/>
    <line x1="50" y1="40" x2="60" y2="25" stroke="#A32F1F" stroke-width="2.5"/>
    <line x1="15" y1="65" x2="120" y2="65" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">8. SIDE PLANK</text>
  </g>

  <!-- 9. Bicycle Crunch -->
  <g transform="translate(485, 195)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="30" cy="45" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <path d="M36,48 L60,58 L70,45 L85,42" fill="none" stroke="#201D17" stroke-width="2.5"/>
    <line x1="48" y1="53" x2="65" y2="35" stroke="#A32F1F" stroke-width="2"/>
    <line x1="15" y1="65" x2="120" y2="65" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">9. BICYCLE CRUNCH</text>
  </g>

  <!-- 10. Superman Hold -->
  <g transform="translate(635, 195)">
    <rect width="135" height="90" fill="#F7F3E8" stroke="#C7BC9F"/>
    <circle cx="25" cy="50" r="6" fill="none" stroke="#201D17" stroke-width="2"/>
    <path d="M31,52 L70,48 L100,40" fill="none" stroke="#201D17" stroke-width="3"/>
    <line x1="35" y1="52" x2="20" y2="38" stroke="#201D17" stroke-width="2"/>
    <line x1="15" y1="60" x2="120" y2="60" stroke="#C7BC9F" stroke-width="1.5"/>
    <text x="67" y="20" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">10. SUPERMAN</text>
  </g>
</svg>
