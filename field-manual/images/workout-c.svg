<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <rect width="800" height="240" fill="#EDE7D8"/>
  <rect x="15" y="15" width="770" height="210" fill="none" stroke="#201D17" stroke-width="2"/>
  <text x="35" y="45" font-family="'Oswald', sans-serif" font-weight="700" font-size="20" fill="#201D17">WORKOUT C — FULL BODY CHALLENGE CIRCUIT</text>
  <text x="35" y="65" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4A453A">Complete all 10 exercises back-to-back. Rest 2 minutes. Repeat 3–5 rounds.</text>
  
  <!-- 5 columns x 2 rows of mini exercise badges -->
  <!-- 1. Push-ups -->
  <g transform="translate(35, 85)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">1. PUSH-UPS (15x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Chest &amp; Triceps</text>
  </g>
  <!-- 2. Squats -->
  <g transform="translate(185, 85)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">2. SQUATS (20x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Quads &amp; Glutes</text>
  </g>
  <!-- 3. Plank -->
  <g transform="translate(335, 85)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">3. PLANK (45s)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Core Stability</text>
  </g>
  <!-- 4. Bulgarian Split Squats -->
  <g transform="translate(485, 85)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">4. SPLIT SQUATS (10/leg)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Unilateral Legs</text>
  </g>
  <!-- 5. Diamond Pushups -->
  <g transform="translate(635, 85)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">5. DIAMOND PUSH (10x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Tricep Focus</text>
  </g>

  <!-- Row 2 -->
  <!-- 6. Jump Squats -->
  <g transform="translate(35, 155)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">6. JUMP SQUATS (10x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Explosive Power</text>
  </g>
  <!-- 7. Chair Dips -->
  <g transform="translate(185, 155)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">7. CHAIR DIPS (12x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Lower Body/Triceps</text>
  </g>
  <!-- 8. Walking Lunges -->
  <g transform="translate(335, 155)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">8. WALKING LUNGE (10/leg)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Dynamic Balance</text>
  </g>
  <!-- 9. Bicycle Crunches -->
  <g transform="translate(485, 155)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">9. BICYCLES (20/side)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Oblique Rotation</text>
  </g>
  <!-- 10. Burpees -->
  <g transform="translate(635, 155)">
    <rect width="135" height="60" fill="#F7F3E8" stroke="#C7BC9F"/>
    <text x="67" y="25" font-family="'Oswald', sans-serif" font-size="11" text-anchor="middle" fill="#A32F1F">10. BURPEES (8x)</text>
    <text x="67" y="42" font-family="'IBM Plex Mono', monospace" font-size="10" text-anchor="middle" fill="#4A453A">Max Conditioning</text>
  </g>
</svg>
